      e.preventDefault();
      const fd = new FormData(kf);
      await sparaFalt(f, {
        webb: fd.get('webb').trim(),
        kund: { tjanster: $$('[data-t][aria-pressed="true"]', kf).map((b) => b.dataset.t), sedan: fd.get('sedan'), varde: +fd.get('varde') || 0, manad: +fd.get('manad') || 0, ant: fd.get('ant').trim() },
      }, 'Kunduppgifterna är sparade');
    };
  }
}

async function sparaFalt(f, andring, msg) {
  try {
    await db.spara({ ...f, ...andring });
    ritaLada(); render(false);
    toast(msg || 'Sparat');
  } catch (err) { toast(err.message, true); ritaLada(); }
}

async function loggaSamtal(f) {
  const sa = $('#sa').value.trim();
  if (!S.pick && !sa) { toast('Välj hur det gick eller skriv vad de sa', true); return; }
  if (!S.me) { valjPerson(); return; }
  const b = $('#saveCall'); b.disabled = true;
  const utfall = S.pick || (f.status === 'att_ringa' ? 'inget_svar' : f.status);
  const payload = {
    samtal: { id: nyId(), tid: new Date().toISOString(), av: S.me, utfall, sa },
    status: utfall,
    nasta: S.nasta || (utfall === 'nej' || utfall === 'kund' ? '' : f.nasta || ''),
    nastaNotis: S.nasta ? sa.split(/[.\n]/)[0].slice(0, 120) : (utfall === 'nej' || utfall === 'kund' ? '' : f.nastaNotis || ''),
  };
  try {
    const ut = await db.samtal(f.id, payload);
    if (utfall === 'kund' && !ut.kund?.sedan) await db.spara({ ...ut, kund: { ...(ut.kund || {}), sedan: idag() } });
    if (!f.ansvarig) await db.spara({ ...S.data.find((x) => x.id === f.id), ansvarig: S.me });
    S.pick = null; S.nasta = '';
    ritaLada(); render(false);
    toast(utfall === 'kund' ? 'Ny kund! Registrera betalningen när de har Swishat.' : 'Samtalet är sparat');
  } catch (err) { toast(err.message, true); b.disabled = false; }
}

/* ================= NYTT / REDIGERA ================= */
function nyttForetag(f) {
  const ny = !f;
  f = f || { status: 'att_ringa', ansvarig: S.me || '' };
  modal(`<form id="fForm" style="display:grid;gap:16px">
    <h2>${ny ? 'Nytt företag' : 'Redigera ' + esc(f.namn)}</h2>
    <div class="fgrid">
      <label class="f full"><span>Företagets namn *</span><input class="in" name="namn" required value="${esc(f.namn || '')}" autofocus placeholder="Bageri Sötdeg AB"></label>
      <label class="f"><span>Telefon</span><input class="in" name="telefon" type="tel" value="${esc(f.telefon || '')}" placeholder="08-123 45 67"></label>
      <label class="f"><span>Kontaktperson</span><input class="in" name="kontakt" value="${esc(f.kontakt || '')}" placeholder="Anna Svensson"></label>
      <label class="f"><span>Bransch</span><input class="in" name="bransch" value="${esc(f.bransch || '')}" placeholder="Bageri" list="branscher"></label>
      <label class="f"><span>Ort</span><input class="in" name="ort" value="${esc(f.ort || '')}" placeholder="Södermalm"></label>
      <label class="f"><span>E-post</span><input class="in" name="epost" type="email" value="${esc(f.epost || '')}"></label>
      <label class="f"><span>Nuvarande sajt</span><input class="in" name="webb" value="${esc(f.webb || '')}" placeholder="foretaget.se"></label>
      ${ny ? `<label class="f"><span>Status</span><select class="in" name="status">${[...FLODE, 'nej'].map((s) => `<option value="${s}" ${f.status === s ? 'selected' : ''}>${ST[s].t}</option>`).join('')}</select></label>
      <label class="f"><span>Ansvarig</span><select class="in" name="ansvarig"><option value="">Ingen</option>${TEAM.map((p) => `<option ${f.ansvarig === p.n ? 'selected' : ''}>${p.n}</option>`).join('')}</select></label>` : ''}
    </div>
    <datalist id="branscher">${[...new Set(S.data.map((x) => x.bransch).filter(Boolean))].map((b) => `<option value="${esc(b)}">`).join('')}</datalist>
    <div class="mact"><button type="button" class="btn ghost" id="fCancel">Avbryt</button>${ny ? '<button type="submit" class="btn" name="ring" value="1">Spara och logga samtal</button>' : ''}<button type="submit" class="btn pri">Spara</button></div>
  </form>`);
  $('#fCancel').onclick = stangModal;
  $('#fForm').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const v = Object.fromEntries([...fd.entries()].map(([k, x]) => [k, String(x).trim()]));
    const dubbel = ny && S.data.find((x) => x.namn.toLowerCase() === v.namn.toLowerCase() || (v.telefon && x.telefon && x.telefon.replace(/\D/g, '') === v.telefon.replace(/\D/g, '')));
    if (dubbel && !e.target.dataset.ok) { e.target.dataset.ok = 1; toast(`${dubbel.namn} finns redan. Tryck Spara igen för att lägga till ändå.`, true); return; }
    const rec = ny ? { id: nyId(), skapad: new Date().toISOString(), samtal: [], ...v } : { ...f, ...v };
    if (rec.status === 'kund' && !rec.kund?.sedan) rec.kund = { ...(rec.kund || {}), sedan: idag() };
    try {
      await db.spara(rec);
      stangModal(); render(false);
      if (ny && e.submitter?.name === 'ring') oppna(rec.id);
      else if (!ny) ritaLada();
      toast(ny ? `${rec.namn} är tillagt` : 'Sparat');
    } catch (err) { toast(err.message, true); }
  };
}

/* ================= IMPORT / EXPORT ================= */
function importera() {
  modal(`<h2>Importera företag</h2>
  <p>Klistra in en rad per företag. Avgränsa med semikolon, tabb eller komma i ordningen:<br><span class="mono" style="color:var(--ink)">Namn; Telefon; Bransch; Ort; Kontaktperson; E-post</span>. Du kan kopiera raderna direkt från Excel eller Google Sheets.</p>
  <textarea class="in" id="impT" style="min-height:180px;font:13px/1.5 var(--mono)" autofocus placeholder="Bageri Sötdeg; 08-640 12 34; Bageri; Södermalm; Anna Berg&#10;Rörkraft AB; 070-111 22 33; Rörmokare; Nacka"></textarea>
  <span class="mono dim" id="impN">0 företag</span>
  <div class="mact"><button class="btn ghost" id="impNo">Avbryt</button><button class="btn pri" id="impYes">Importera</button></div>`);
  const parse = () => $('#impT').value.split(/\r?\n/).map((r) => r.trim()).filter(Boolean).map((r) => {
    const c = r.split(r.includes('\t') ? '\t' : r.includes(';') ? ';' : ',').map((x) => x.trim());
    return { id: nyId(), skapad: new Date().toISOString(), status: 'att_ringa', samtal: [], ansvarig: '', namn: c[0] || '', telefon: c[1] || '', bransch: c[2] || '', ort: c[3] || '', kontakt: c[4] || '', epost: c[5] || '' };
  }).filter((x) => x.namn && !/^namn$/i.test(x.namn));
  $('#impT').oninput = () => { const n = parse().length; $('#impN').textContent = n + (n === 1 ? ' företag' : ' företag'); };
  $('#impNo').onclick = stangModal;
  $('#impYes').onclick = async () => {
    const l = parse();
    const finns = new Set(S.data.map((x) => x.namn.toLowerCase()));
    const nya = l.filter((x) => !finns.has(x.namn.toLowerCase()));
    if (!nya.length) { toast(l.length ? 'Alla fanns redan i listan' : 'Inget att importera', true); return; }
    try { await db.importera(nya); stangModal(); S.f.st = 'att_ringa'; render(false); toast(`${nya.length} företag importerade${l.length > nya.length ? `, ${l.length - nya.length} fanns redan` : ''}`); }
    catch (err) { toast(err.message, true); }
  };
}
function exportera() {
  const kol = ['Namn', 'Status', 'Telefon', 'Kontaktperson', 'E-post', 'Bransch', 'Ort', 'Webbplats', 'Ansvarig', 'Nästa uppföljning', 'Antal samtal', 'Senast sagt'];
  const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rader = filtrerade().map((f) => [f.namn, ST[f.status]?.t, f.telefon, f.kontakt, f.epost, f.bransch, f.ort, f.webb, f.ansvarig, f.nasta, (f.samtal || []).length, senaste(f)?.sa].map(cell).join(';'));
  const blob = new Blob(['﻿' + [kol.map(cell).join(';'), ...rader].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `kantljus-ringlista-${idag()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================= TANGENTBORD ================= */
document.addEventListener('keydown', (e) => {
  if ($('#app').hidden) return;
  const skriver = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === 'Escape' && LV.pa && !$('#modal').classList.contains('on')) { if (!document.fullscreenElement) stangLive(); return; }
  if (LV.pa) return;
  if (e.key === 'Escape') { if ($('#modal').classList.contains('on') && S.me) return stangModal(); if (S.open) return stangLada(); }
  if (skriver || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); if (S.view !== 'ringlista') ga('ringlista'); $('#q')?.focus(); }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); nyttForetag(); }
  if (['1', '2', '3', '4', '5', '6'].includes(e.key)) ga(Object.keys(VIEWS)[+e.key - 1]);
});
